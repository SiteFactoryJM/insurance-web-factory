name: Bootstrap repository

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand project bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk_* > /tmp/insurance-web-factory.b64
          base64 --decode /tmp/insurance-web-factory.b64 > /tmp/insurance-web-factory.tar.gz
          tar -xzf /tmp/insurance-web-factory.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: build insurance website factory"
            git push origin HEAD:main
          fi
