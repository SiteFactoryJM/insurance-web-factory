name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calm-trust-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  verify-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify connected Cloudflare build is live
        env:
          LIVE_URL: https://insurance-web-factory.pjmsm0319.workers.dev
        run: |
          set -euo pipefail
          verified=0
          for attempt in $(seq 1 30); do
            all=1
            for theme in trust-blue warm-care premium-navy clean-minimal local-friendly; do
              html=$(curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "$LIVE_URL/?theme=$theme&verify=${GITHUB_SHA:0:12}") || { all=0; break; }
              grep -q 'data-design-version="calm-trust-v4"' <<<"$html" || { all=0; break; }
              grep -q "theme-$theme" <<<"$html" || { all=0; break; }
              grep -q 'data-submission-mode="discard"' <<<"$html" || { all=0; break; }
            done
            if [ "$all" -eq 1 ]; then verified=1; break; fi
            echo "Waiting for connected Cloudflare build ($attempt/30)"
            sleep 10
          done
          test "$verified" -eq 1 || { echo '::error::Connected Cloudflare build was not verified. Inspect Cloudflare Builds or run Deploy Cloudflare demo with configured secrets.'; exit 1; }
          echo "### Calm Trust live verification passed" >> "$GITHUB_STEP_SUMMARY"
          echo "$LIVE_URL/templates — five variants and demo-only consultation form verified." >> "$GITHUB_STEP_SUMMARY"
