name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '운영 배포 확인을 위해 DEPLOY_PRODUCTION 입력'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Guard main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploy is allowed only from main"
            exit 1
          fi

      - name: Confirm production deployment
        env:
          CONFIRM_VALUE: ${{ inputs.confirm }}
        shell: bash
        run: |
          if [ "$CONFIRM_VALUE" != "DEPLOY_PRODUCTION" ]; then
            echo "::error::Type DEPLOY_PRODUCTION to confirm the production deployment"
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static and unit checks
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Generate production domain config
        run: npm run domains:generate

      - name: Validate generated production config
        run: node scripts/validate-production-config.mjs

      - name: List production targets
        run: node scripts/list-production-sites.mjs

      - name: Check Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret is not configured in the production environment"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not configured in the production environment"; exit 1; }
          {
            echo "## Production deployment"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Worker: \`insurance-web-factory\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.domains.jsonc

      - name: Verify production domains
        run: node scripts/verify-production.mjs
