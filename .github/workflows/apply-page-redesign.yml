name: Apply page redesign

on:
  push:
    branches: [main]
    paths:
      - ".page-update/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply redesigned site files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .page-update/chunk_00 ]; then
            echo "Payload already applied"
            exit 0
          fi

          cat \
            .page-update/chunk_00 \
            .page-update/chunk_01 \
            .page-update/chunk_02 \
            .page-update/chunk_03 \
            .page-update/chunk_04 \
            .page-update/chunk_05 \
            .page-update/chunk_060 \
            .page-update/chunk_061 \
            .page-update/chunk_062 \
            .page-update/chunk_063 \
            .page-update/chunk_070 \
            .page-update/chunk_071 \
            .page-update/chunk_072 \
            .page-update/chunk_073 \
            .page-update/chunk_080 \
            .page-update/chunk_081 \
            > /tmp/page-redesign.b64

          echo "e7715f84143c20b0e8cd1015ed7f39c24987086b1b1c234a20e7a98e245dbaaf  /tmp/page-redesign.b64" | sha256sum --check
          base64 --decode /tmp/page-redesign.b64 > /tmp/page-redesign.tar.gz
          echo "7b3750fa28835d622f9b5a1245cb273d30d32aae772370e6874a44b4b27adeb7  /tmp/page-redesign.tar.gz" | sha256sum --check
          tar -xzf /tmp/page-redesign.tar.gz -C .
          rm -rf .page-update

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: redesign five insurance adviser themes"
            git push origin HEAD:main
          fi
