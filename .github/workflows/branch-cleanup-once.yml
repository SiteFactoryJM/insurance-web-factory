name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  delete-old-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "claude/affectionate-dijkstra-uxzwfm"
            "feat/instagram-image-first"
            "figma-clear-human-rebuild-20260920"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            status="$(curl -sS -o /tmp/delete-response.json -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPO/git/refs/heads/$branch")"

            if [ "$status" = "204" ] || [ "$status" = "404" ]; then
              echo "$branch: deleted or already absent"
            else
              cat /tmp/delete-response.json
              echo "Failed to delete $branch (HTTP $status)"
              exit 1
            fi
          done
