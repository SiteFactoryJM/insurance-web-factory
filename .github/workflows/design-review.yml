name: Design review
on:
  push:
    branches: [feat/calm-trust-accessibility]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Capture supplied public reference
        run: |
          mkdir -p review
          curl --fail --location --max-time 30 https://effortless-crepe-81a1fd.netlify.app/ -o review/reference.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Text(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hidden=0; self.lines=[]
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style'): self.hidden+=1
              def handle_endtag(self,tag):
                  if tag in ('script','style'): self.hidden=max(0,self.hidden-1)
              def handle_data(self,data):
                  if not self.hidden and data.strip(): self.lines.append(data.strip())
          p=Text(); p.feed(Path('review/reference.html').read_text())
          text='\n'.join(p.lines)
          Path('review/reference-text.txt').write_text(text)
          print(text)
          PY
      - name: Export source for design review
        if: always()
        run: git archive --format=zip HEAD -o review/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-review
          path: review/
          retention-days: 7
